<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Cuenta</title>
    <link rel="stylesheet" href="Recupersr.css">
</head>
<body>
    <div class="container">
        <h1>Recuperar cuenta</h1>
        <form id="recuperarForm">
            <div class="input-nombre">
                <div class="input-field">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" placeholder="Nombre">
                </div>
            </div>
            <div class="input-field">
                <label for="correo">Correo</label>
                <input type="email" id="correo" placeholder="Tu correo electrónico">
            </div>
            <button type="submit">Recuperar Contraseña</button>
        </form>
        <p id="mensaje"></p>
        <div class="input-field">
            <p>&copy; 2025 | <a href="InicioSesion.html">Iniciar sesión</a></p>
        </div>
    </div>

    <script>
        document.getElementById('recuperarForm').addEventListener('submit', function(event) {
            event.preventDefault();
            recuperarContrasena();
        });

        function recuperarContrasena() {
            const nombre = document.getElementById('nombre').value.trim();
            const correo = document.getElementById('correo').value.trim();
            const mensajeElemento = document.getElementById('mensaje');

            if (!nombre || !correo) {
                mensajeElemento.textContent = "Por favor, ingresa todos los campos.";
                mensajeElemento.style.color = "red";
                return;
            }

            let usuarios = JSON.parse(localStorage.getItem('usuarios')) || [];
            let usuarioEncontrado = false;
            let contrasenaEncontrada = "";

            for (let i = 0; i < usuarios.length; i++) {
                if (usuarios[i].nombre === nombre && usuarios[i].correo === correo) {
                    usuarioEncontrado = true;
                    contrasenaEncontrada = usuarios[i].contrasena;
                    break;
                }
            }

            if (usuarioEncontrado) {
                mensajeElemento.textContent = `Tu contraseña es: ${contrasenaEncontrada}`;
                mensajeElemento.style.color = "green";
            } else {
                mensajeElemento.textContent = "El usuario o el correo son incorrectos. Inténtalo de nuevo.";
                mensajeElemento.style.color = "red";
            }
        }
    </script>
</body>
</html>
