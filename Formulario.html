<!DOCTYPE html>
<html lang="es"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="stylesheet" href="Formulario.css">
</head>
<body>
    <div class="container">
        <h1>REGISTRO</h1>
        <form id="registro">
            <div class="input-nombre">
                <div class="input-field">
                    <label for="nombre">NOMBRE </label>
                    <input type="text" id="nombre" placeholder="Tu nombre">
                </div>
                <div class="input-field">
                    <label for="correo">EDAD</label>
                    <input type="text" id="edad" placeholder="Tu edad">
                </div>
            </div>
            <div class="input-field">
                <label for="correo">NOMBRE DE USUARIO</label>
                <input type="text" id="user" placeholder="Tu usuario">
            </div>
            <div class="input-field">
                <label for="correo">CORREO</label>
                <input type="email" id="correo" placeholder="Tu correo electrónico">
            </div>
            <div class="input-field">
                <label for="contrasena">CONTRASEÑA</label>
                <input type="password" id="contrasena" placeholder="Contraseña">
            </div>
            <button type="submit">ENVIAR</button>
        </form>
    </div>
    <div class="input-field">
        <p>&copy; 2025 | <a href="InicioSesion.html">Iniciar sesión</a></p>
    </div>

    <script>
        document.getElementById('registro').addEventListener('submit', function(event) {
            event.preventDefault();
            guardarUsuario();
        });

        function guardarUsuario() {
            const nombre = document.getElementById('nombre').value.trim();
            const edad = document.getElementById('edad').value.trim();
            const user = document.getElementById('user').value.trim();
            const correo = document.getElementById('correo').value.trim();
            const contrasena = document.getElementById('contrasena').value.trim();

            if (!nombre ||!edad || !user|| !correo || !contrasena ) {
                alert("Por favor, completa todos los campos.");
                return;
            }

            const usuario = { nombre, edad, user, correo, contrasena };

            let usuarios = JSON.parse(localStorage.getItem('usuarios')) || [];

            usuarios.push(usuario);
            localStorage.setItem('usuarios', JSON.stringify(usuarios));

            document.getElementById('registro').reset();

            window.location.href = "InicioSesion.html";
        }
    </script>
</body>
</html>
